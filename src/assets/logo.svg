<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Gradiente do texto (Coral para Magenta) -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b72" />
      <stop offset="100%" stop-color="#c94bf5" />
    </linearGradient>

    <!-- Fundo radial ajustado para a nova proporção -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#2a2432" />
      <stop offset="100%" stop-color="#121014" />
    </radialGradient>

    <!-- Filtro de Glow calibrado para o novo tamanho -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.8" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base com área expandida (2px de margem apenas para antialiasing) -->
  <rect x="2" y="2" width="116" height="116" rx="28" fill="url(#bg-grad)" stroke="#322d3b" stroke-width="1.5" />

  <!-- Letras VI redimensionadas para preenchimento óptico ideal -->
  <g filter="url(#glow)">
    <!-- Letra V -->
    <path d="M 13 25 L 33 25 L 47 65 L 61 25 L 81 25 L 57 95 L 37 95 Z" fill="url(#text-grad)" />
    <!-- Letra I -->
    <rect x="89" y="25" width="18" height="70" rx="1" fill="url(#text-grad)" />
  </g>
</svg>
